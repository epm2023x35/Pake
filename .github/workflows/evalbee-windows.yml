name: Build EvalBee Windows MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build EvalBee MSI
        run: pake https://evalbee.com --name EvalBee --width 1200 --height 780

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: EvalBee-Windows-MSI
          path: "*.msi"
          retention-days: 5
